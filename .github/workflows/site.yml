name: Site

# Publishes site/ as the website at https://chainpen.github.io/chainpen/ with GitHub Pages, whenever the site changes
# on main. It can also be run by hand (Actions → Site → Run workflow).
#
# Before it can work, someone with admin access sets Settings → Pages → Source to "GitHub Actions". Pages is only
# offered once the repository is public, so until then the job is skipped rather than left failing.
#
# The page's download buttons point at releases/latest/download/…, which GitHub sends to the newest published
# release, so a new release needs no change here. A release marked "pre-release" doesn't count as the latest.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. A newer one waits for the one in progress instead of cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, not one. GitHub's list of a run's artifacts can lag behind an upload, and a deployment started straight
  # after it then fails with "No artifacts named github-pages" (actions/deploy-pages issue 451). A separate job starts
  # later, and can be run again by itself: running the upload again would leave two artifacts, which also fails.
  package:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the site folder is published: nothing else in the repository is served.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Starting a job has usually been long enough for the artifact to be listed; this covers the times it isn't.
      - name: Wait for the artifact to be listed
        run: sleep 20

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
